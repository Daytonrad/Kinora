# Kinora for iPhone and iPad – native SwiftUI app.
# The Xcode project is generated from this file and is not committed:
#   cd apps/ios && xcodegen        (brew install xcodegen)
# Signing: copy Config/Local.example.xcconfig to Config/Local.xcconfig and set your team.
name: Kinora
options:
  bundleIdPrefix: io.github.scotylucas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: hu
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KinoraKit:
    path: KinoraKit
targets:
  Kinora:
    type: application
    platform: iOS
    sources:
      - path: Kinora
    dependencies:
      - package: KinoraKit
      - target: KinoraWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID)
        PRODUCT_NAME: Kinora
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    # The App Group carries the saved servers and the login token to the widgets.
    entitlements:
      path: Kinora/Kinora.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
    info:
      path: Kinora/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        # kinora://item/42 and kinora://play/42, opened by the widgets.
        CFBundleURLTypes:
          - CFBundleURLName: $(KINORA_BUNDLE_ID)
            CFBundleURLSchemes: [kinora]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The user picks the server, and self-hosted servers often answer on plain HTTP,
        # at home and at a public address alike (http://203.0.113.5:8096). iOS ignores
        # NSAllowsArbitraryLoads when NSAllowsLocalNetworking is also set, so only this one.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: A Kinora a helyi hálózaton keresi és éri el a médiaszerveredet.
  KinoraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KinoraWidgets
    dependencies:
      - package: KinoraKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID).widgets
        PRODUCT_NAME: KinoraWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: KinoraWidgets/KinoraWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KINORA_BUNDLE_ID)]
    info:
      path: KinoraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        KinoraAppGroup: group.$(KINORA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
schemes:
  Kinora:
    build:
      targets:
        Kinora: all
    run:
      config: Debug
    archive:
      config: Release
