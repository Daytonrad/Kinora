# Kinora for iPhone and iPad – native SwiftUI app.
# The Xcode project is generated from this file and is not committed:
#   cd apps/ios && xcodegen        (brew install xcodegen)
# Signing: copy Config/Local.example.xcconfig to Config/Local.xcconfig and set your team.
name: Kinora
options:
  bundleIdPrefix: io.github.scotylucas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: hu
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KinoraKit:
    path: KinoraKit
targets:
  Kinora:
    type: application
    platform: iOS
    sources:
      - path: Kinora
    dependencies:
      - package: KinoraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KINORA_BUNDLE_ID)
        PRODUCT_NAME: Kinora
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Kinora/Info.plist
      properties:
        CFBundleDisplayName: Kinora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: hu
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Home servers answer on plain HTTP at LAN addresses (http://192.168.1.10:8096).
        # IP literals and .local names fall under NSAllowsLocalNetworking; public servers
        # are expected to use HTTPS (reverse proxy, Cloudflare/Tailscale).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: A Kinora a helyi hálózaton keresi és éri el a médiaszerveredet.
schemes:
  Kinora:
    build:
      targets:
        Kinora: all
    run:
      config: Debug
    archive:
      config: Release
