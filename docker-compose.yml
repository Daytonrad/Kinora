# Kinora – alap telepítés:  docker compose up -d   →  http://<szerver-ip>:8096
services:
  kinora:
    image: ghcr.io/scotylucas/kinora:latest   # AMD GPU-hoz: :latest-amd
    container_name: kinora
    ports:
      - "8096:8096"
      # Jellyfin-kompatibilis API (Infuse, Swiftfin, Findroid, Kodi): ezt a portot és lent a KINORA_JELLYFIN_COMPAT
      # sort is vedd ki a kommentből, aztán a Kinorában Admin → Beállítások → Jellyfin-kompatibilis API → be.
      # - "8097:8097"
    environment:
      - TZ=Europe/Budapest
      - PUID=1000
      - PGID=1000
      # - KINORA_PUBLIC_URL=https://kinora.pelda.hu
      # - KINORA_TMDB_KEY=...
      # - KINORA_LOG_FORMAT=json
      # - KINORA_JELLYFIN_COMPAT=1        # megnyitja a Jellyfin-kompatibilis API portját (alapból :8097)
      # - KINORA_JELLYFIN_ADDR=:8097      # másik port esetén a fenti "ports" sort is írd át
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/Filmek_file/Filmek:/media/movies:ro
      - /mnt/Filmek_file/Sorozatok:/media/shows:ro
    # Intel/AMD hardveres gyorsítás:
    # devices: ["/dev/dri:/dev/dri"]
    # group_add: ["video", "render"]
    restart: unless-stopped
