name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/scotylucas/kinora

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: container smoke test
        run: SMOKE_LOGS=1 bash scripts/smoke.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  smoke:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (test media + segment check)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: container smoke test
        run: SMOKE_LOGS=1 bash scripts/smoke.sh

  # One native build per architecture and variant (no QEMU: cgo/sqlite builds natively on the arm runner),
  # pushed by digest and stitched into multi-arch manifests by the merge job.
  build:
    needs: smoke
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
        variant:
          - { name: default, amd: "0" }
          - { name: amd, amd: "1" }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "v=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch.name }}
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
            AMD=${{ matrix.variant.amd }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}-${{ matrix.arch.name }}
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant:
          - { name: default, suffix: "" }
          - { name: amd, suffix: "-amd" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # tag and digest lists must split into separate arguments
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # Native Windows build, only for releases (v*.*.* tags): kinora.exe + ffmpeg + the install/update scripts,
  # attached to the GitHub Release. scripts/windows/update.ps1 on the servers picks up only these releases.
  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # BtbN's GPL build of the ffmpeg 8.1 branch: NVENC, QSV, AMF and libx264 included
      FFMPEG_ZIP: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build kinora.exe (cgo/sqlite with MinGW)
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          gcc --version | head -1
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -extldflags=-static -X github.com/ScotyLucas/kinora/internal/server.Version=${GITHUB_REF_NAME}" \
            -o dist/kinora/kinora.exe ./cmd/kinora
      - name: ffmpeg
        run: |
          curl -fsSL -o ffmpeg.zip "$FFMPEG_ZIP"
          unzip -q ffmpeg.zip -d ffmpeg-src
          mkdir -p dist/kinora/ffmpeg
          cp ffmpeg-src/*/bin/ffmpeg.exe ffmpeg-src/*/bin/ffprobe.exe dist/kinora/ffmpeg/
          cp ffmpeg-src/*/LICENSE.txt dist/kinora/ffmpeg/LICENSE.txt
      - name: package
        run: |
          cp scripts/windows/install.ps1 scripts/windows/update.ps1 LICENSE dist/kinora/
          cp docs/WINDOWS.md dist/kinora/README.md
      - name: smoke test
        run: |
          dist/kinora/kinora.exe version | grep -F "$GITHUB_REF_NAME"
          dist/kinora/kinora.exe --data "$RUNNER_TEMP/kdata" --addr 127.0.0.1:18096 --discovery-port 0 &
          pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18096/api/status && break; sleep 1; done
          curl -fs http://127.0.0.1:18096/api/status
          kill "$pid" || true
      - name: zip + checksum
        shell: pwsh
        run: |
          $zip = "kinora-windows-amd64.zip"
          Compress-Archive -Path dist/kinora/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
      - name: setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & $iscc /Qp "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\kinora" "/O$PWD" scripts\windows\kinora.iss
          if ($LASTEXITCODE) { exit 1 }
          $exe = "kinora-setup.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  $exe" | Out-File -Encoding ascii "$exe.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kinora-windows-amd64.zip
            kinora-windows-amd64.zip.sha256
            kinora-setup.exe
            kinora-setup.exe.sha256
