name: apps

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["apps/**", "web/static/style.css", "web/static/fonts/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["apps/**", "web/static/style.css", ".github/workflows/apps.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps

jobs:
  # shared UI: unit tests, then the two TV packages (no device SDK needed for these)
  tv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:webos
      - run: npm run build:tizen   # unsigned: signing needs the owner's Samsung certificate
      - uses: actions/upload-artifact@v4
        with:
          name: kinora-tv
          path: |
            apps/webos/dist/*.ipk
            apps/tizen/dist/*.wgt

  android:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # the runner image ships the Android SDK (ANDROID_HOME); Gradle installs the
      # missing platform/build-tools itself once the licences are accepted
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - name: version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "KINORA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: npm run build:android
      # Release signing only when the keystore secrets exist (never committed to the repo).
      - name: release APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KINORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KINORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KINORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kinora.jks"
          KINORA_KEYSTORE="$RUNNER_TEMP/kinora.jks" npm run build:release -w android
          rm -f "$RUNNER_TEMP/kinora.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: kinora-android
          path: apps/android/dist/*.apk

  # iOS: native SwiftUI app. KinoraKit unit tests + an unsigned simulator build.
  # Signing for a real device needs a DEVELOPMENT_TEAM in Config/Local.xcconfig – see apps/ios/README.md.
  # Only on a manual run (Actions → apps → Run workflow), not on pushes, tags or pull requests.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: swift test --package-path KinoraKit
      - run: xcodegen
      - run: >
          xcodebuild -project Kinora.xcodeproj -scheme Kinora
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: >
          xcodebuild -project Kinora.xcodeproj -scheme KinoraTV
          -sdk appletvsimulator -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
